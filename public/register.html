<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | TaskFlow</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body class="auth-page">
    <header class="navbar">
      <div class="container nav-content">
        <a href="/" class="logo">TaskFlow<span>.</span></a>

        <nav class="nav-links">
          <span class="nav-prompt">Already have an account?</span>
          <a href="/login.html" class="nav-login">Sign in</a>
        </nav>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <div class="auth-heading">
          <div class="auth-icon">✦</div>

          <h1>Create your account</h1>

          <p>Start organizing your work with TaskFlow.</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="name">Full name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
              minlength="2"
            />
          </div>

          <div class="form-group">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
              minlength="8"
            />

            <small class="input-hint"> Use at least 8 characters. </small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter your password again"
              autocomplete="new-password"
              required
            />
          </div>

          <div id="message" class="form-message" role="alert"></div>

          <button
            type="submit"
            id="registerButton"
            class="btn btn-primary auth-submit"
          >
            Create Account
          </button>
        </form>

        <p class="auth-footer">
          By creating an account, you agree to use TaskFlow responsibly.
        </p>
      </section>
    </main>

    <script src="/js/register.js"></script>
  </body>
</html>
