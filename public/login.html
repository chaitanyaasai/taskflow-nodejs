<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TaskFlow</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        color: #2563eb;
        text-align: center;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 26px;
        color: #1e293b;
        text-align: center;
        margin-bottom: 10px;
      }

      .description {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }

      .success {
        color: #15803d;
      }

      .error {
        color: #dc2626;
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #64748b;
      }

      .footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">TaskFlow</div>

      <h1>Welcome Back!</h1>

      <p class="description">
        Sign in to manage your tasks and stay productive.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="loginButton">Sign In</button>
      </form>

      <div id="message" class="message"></div>

      <div class="footer">
        Don't have an account?
        <a href="/register.html">Create Account</a>
      </div>
    </div>

    <script src="/js/login.js"></script>
  </body>
</html>
